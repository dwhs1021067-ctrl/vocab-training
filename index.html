}
function scheduleNext(ms, wait = null){
  const s = SES, q = s.q; q.doneAt = Date.now();
  clearTimeout(s.timer);
  const go = () => { if(SES === s && s.q === q && !s.ended && !q.hold) nextQ(); };
  if(!wait){ s.timer = setTimeout(go, ms); return; }
  /* 至少等 ms 毫秒，且等發音播完（再停 0.15 秒） */
  let a = false, b = false; const tryGo = () => { if(a && b) go(); };
  s.timer = setTimeout(() => { a = true; tryGo(); }, ms);
  wait.then(() => setTimeout(() => { b = true; tryGo(); }, 150));
}
function checkSpell(){
  const q = SES && SES.q; if(!q || q.done || q.type !== 'spell') return;
  const inp = $('#spell-in'), val = inp.value;
  if(!str(val)){ toast('請先輸入答案，或點「不會」'); return; }
  const ok = normAns(val) === normAns(W[q.id].en);
  inp.classList.add(ok ? 'good' : 'bad'); inp.readOnly = true;
  answer(ok, {input: ok ? '' : val});
}

function renderMatch(q){
  const body = $('#s-body');
  q.mistakes = new Set(); q.left = 0; q.selL = null; q.selR = null;
  const L1 = shuffle(q.ids.slice()), R1 = shuffle(q.ids.slice());
  body.innerHTML = `<div class="prompt" style="padding:8px 0 16px"><div class="zh" style="font-size:20px">配對英文與中文</div><div class="hint">點一個英文，再點對應的中文</div></div>
    <div class="match"><div class="col">${L1.map(id => `<button class="mt en" data-act="mt" data-side="L" data-id="${id}">${esc(W[id].en)}</button>`).join('')}</div>
    <div class="col">${R1.map(id => `<button class="mt" data-act="mt" data-side="R" data-id="${id}">${esc(W[id].zh)}</button>`).join('')}</div></div>`;
  q.left = q.ids.length;
}
function tapMatch(el){
  const q = SES.q; if(q.done) return;
  const side = el.dataset.side;
  document.querySelectorAll(`.mt[data-side="${side}"]`).forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
  /* 配對只在點英文時唸（自動朗讀或答對發音任一開啟即唸），配對成功時不再重複 */
  if(side === 'L'){ q.selL = el; if(S.autoSpeak || S.speakOnCorrect) speak(W[el.dataset.id].en); } else q.selR = el;
  if(!(q.selL && q.selR)) return;
  const a = q.selL, b = q.selR; q.selL = q.selR = null;
  if(a.dataset.id === b.dataset.id){
    a.classList.add('done'); b.classList.add('done'); q.left--;
    if(!q.left) finishMatch(q);
  } else {
    q.mistakes.add(a.dataset.id); q.mistakes.add(b.dataset.id);
    [a,b].forEach(x => { x.classList.remove('sel'); x.classList.add('bad'); setTimeout(() => x.classList.remove('bad'), 450); });
  }
}
function finishMatch(q){
  q.done = true;
  q.ids.forEach(id => {
    const ok = !q.mistakes.has(id); SES.ans++; if(ok) SES.cor++;
    record(id, 'match', ok);
    if(!ok) q.phase.onMatchWrong(id);
  });
  updateFinished(); save('progress','pool','log','books');
  keyboardForNext();
  const wrong = q.ids.filter(id => q.mistakes.has(id));
  $('#s-foot').innerHTML = `<button class="vbar ${wrong.length?'no':'ok'}" data-act="next"><span>${wrong.length ? `配錯 ${wrong.length} 個字` : '全部配對正確'}</span><small>${wrong.length ? '配錯的字已加入錯字池' : ''}</small></button>`;
  setHeader();
  scheduleNext(wrong.length ? 1800 : 900);
}

function endSession(){
  const s = SES; s.ended = true;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('#s-label').textContent = '完成'; $('#s-count').textContent = ''; $('#s-bar').style.width = '100%';
  const acc = s.ans ? Math.round(s.cor/s.ans*100) : 0;
  $('#s-body').innerHTML = `<div class="summary"><div class="big">${s.ans ? acc + '%' : '✓'}</div><p class="sub" style="margin-top:8px">${s.opts.group ? `第 ${s.opts.group} 組完成，` : ''}${s.ans ? '本次正確率' : '這一輪完成了'}</p></div>
    <div class="sumgrid">
      <div><b>${s.ans}</b><span>作答題數</span></div><div><b>${s.newL}</b><span>新學單字</span></div>
      <div><b>${s.five}</b><span>完成五關（待確認）</span></div><div><b>${s.confirmed}</b><span>確認精通</span></div>
    </div>
    ${s.poolOut ? `<p class="small" style="text-align:center;margin:-8px 0 0">移出錯字池 ${s.poolOut} 個字</p>` : ''}`;
  $('#s-foot').innerHTML = s.opts.again ? `<div class="row"><button class="btn ghost" data-act="quit-now">回到主畫面</button><button class="btn" data-act="again">${s.opts.againLabel || '繼續下一組'}</button></div>`
    : `<button class="btn" data-act="quit-now">回到主畫面</button>`;
}

function startToday(){
  const due = dueIds(), dueSet = new Set(due);
  const pool = poolIds().filter(id => !dueSet.has(id)).slice(0, POOL_CAP);
  const tb = S.trainBooks.filter(bookById);
  const scope = tb.length ? scopeIds(tb) : Object.keys(W);
  const cap = Math.max(0, S.dailyNew - (todayLog().nw || 0));
  const batch = buildBatch(scope, S.batchSize, cap);
  if(!due.length && !pool.length && !batch.length){ toast(cap ? '這個範圍的單字都學完了' : '今天的訓練都完成了'); return; }
  startSession([due.length && ReviewPhase(shuffle(due)), pool.length && PoolPhase(shuffle(pool)), batch.length && MasteryPhase(batch, scope)]);
}
function startMastery(bookIds, group = 1, carry = []){
  const scope = scopeIds(bookIds);
  if(!scope.length){ toast('這個範圍沒有單字'); return; }
  const batch = buildBatch(scope, S.batchSize, Infinity);
  if(!batch.length){ toast('這個範圍的單字都已完成五關'); return; }
  const ph = MasteryPhase(batch, scope, {group, carry});
  startSession([ph], {group, again: () => startMastery(bookIds, group + 1, ph.carryOut())});
}
function startCloze(){
  const ids = clozeIds();
  if(!ids.length) return toast('還沒有可以出克漏字的已精通單字');
  if(Object.keys(W).length < 4) return toast('總庫至少需要 4 個單字才能出選擇題');
  startSession([ClozePhase(ids)], {again: () => startCloze(), againLabel:'再練一組'});
}

/* ========== 事件 ========== */
async function readFile(){
  return new Promise(res => {
    const inp = $('#file-in'); inp.value = '';
    inp.onchange = () => { const f = inp.files[0]; if(!f) return res(null); const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => res(null); r.readAsText(f); };
    inp.click();
  });
}
function parseJSON(text){
  try{ return JSON.parse(text.replace(/^﻿/, '')); }
  catch(e){ throw new Error('JSON 格式有誤，請檢查是否完整複製（含開頭與結尾的括號）。'); }
}
function doImportWords(text){
  const out = $('#import-result');
  try{
    const r = importWords(parseJSON(text));
    const notFound = r.skipped.filter(x => x.endsWith('總庫沒有這個字')).length;
    out.style.color = '';
    out.textContent = `已放進總庫：新增 ${r.added} 個字，更新 ${r.updated} 個字`
      + (r.tagged ? `\n已加上分組標籤 ${r.tagged} 個字${r.tagSame ? `（其中 ${r.tagSame} 個原本就已有這些分組）` : ''}` : '')
      + (r.replaced.length ? `\n已用完整資料覆蓋 ${r.replaced.length} 個手動新增的字（進度保留）：${r.replaced.slice(0,30).join('、')}${r.replaced.length > 30 ? '…' : ''}` : '')
      + (r.badTags.length ? `\n無法辨識的分組標籤已忽略：${r.badTags.join('、')}` : '')
      + (r.skipped.length ? `\n略過 ${r.skipped.length} 筆${notFound ? `（其中 ${notFound} 筆總庫沒有這個字）` : ''}：\n${r.skipped.slice(0,10).join('\n')}${r.skipped.length > 10 ? '\n…' : ''}` : '');
    $('#import-text').value = '';
    toast(`匯入完成：新增 ${r.added}、更新 ${r.updated}${r.tagged ? `、加上分組 ${r.tagged}` : ''}`);
  }catch(e){ out.style.color = 'var(--red)'; out.textContent = e.message; }
}
function doRestore(text){
  try{
    const obj = parseJSON(text);
    if(!confirm('還原會以備份內容取代目前所有資料，確定要還原嗎？')) return;
    restoreBackup(obj); closeSheet(); render(); toast('已還原備份');
  }catch(e){ alert(e.message); }
}

const ACT = {
  tab: el => { TAB = el.dataset.tab; OPEN_BOOK = null; DRAWN = null; BOOK_EDIT = false; render(); window.scrollTo(0,0); },
  wtab: el => { WTAB = el.dataset.k; render(); },
  'err-tab': el => { ERR_TAB = el.dataset.k; render(); },
  'mastered-list': () => openMasteredList(),
  'word-stat': el => openWordSheet(el.dataset.id),
  col: el => {
    const id = el.dataset.chart; document.querySelectorAll(`#${id} .col`).forEach(b => b.classList.toggle('sel', b === el));
    $(`#${id}-cap`).textContent = (CHART_TIPS[id] || [])[+el.dataset.i] || '';
  },
  speak: el => speak(el.dataset.text),
  'add-word': el => openAddWord({en: el.dataset.en || '', tags: TAB === 'words' && WTAB === 'library' && LIB_TAG !== 'all' ? [LIB_TAG] : []}),
  'lib-tag': el => { LIB_TAG = el.dataset.k; render(); },
  'draw-open': () => { if(!Object.keys(W).length) return toast('總庫還沒有單字'); openDrawSheet(); },
  'goto-train': () => { DRAWN = null; OPEN_BOOK = null; TAB = 'settings'; render(); setTimeout(() => { const e = $('#train-src'); if(e) e.scrollIntoView({block:'center'}); }, 30); },
  'word-edit': el => { const id = el.dataset.id; openAddWord({editId:id, onDone: () => { render(); openWordSheet(id); }, onCancel: () => openWordSheet(id)}); },
  'copy-manual': async () => {
    const list = manualIds().map(id => W[id].en).sort((a,b) => a.toLowerCase() < b.toLowerCase() ? -1 : 1);
    if(!list.length) return toast('目前沒有手動新增的單字');
    toast(await copyText(list.join('\n')) ? `已複製 ${list.length} 個字` : '複製失敗，請再試一次');
  },
  'goto-import': () => { TAB = 'settings'; render(); setTimeout(() => $('#import-sec').scrollIntoView(), 30); },
  'start-today': () => startToday(),
  'pick-mastery': () => { if(Object.keys(W).length < 4) return toast('總庫至少需要 4 個單字才能出選擇題'); openScopeSheet(); },
  'start-review': () => { const d = dueIds(); if(d.length) startSession([ReviewPhase(shuffle(d))]); },
  'start-pool': () => { const p = poolIds(); if(p.length) startSession([PoolPhase(shuffle(p).slice(0, POOL_CAP))]); },
  'start-cloze': () => startCloze(),
  word: el => openWordSheet(el.dataset.id),
  'open-book': el => { OPEN_BOOK = el.dataset.id; BOOK_EDIT = false; BOOK_SEL.clear(); render(); window.scrollTo(0,0); },
  'close-book': () => { OPEN_BOOK = null; DRAWN = null; BOOK_EDIT = false; render(); },
  'new-book': () => { const n = str(prompt('單字簿名稱')); if(!n) return; if(bookByName(n)) return toast('已有同名的單字簿'); newBook(n); save('books'); render(); },
  'book-add': () => { const b = bookById(OPEN_BOOK); if(!Object.keys(W).length) return toast('總庫還沒有單字'); openBookPicker(b); },
  'book-edit': () => { BOOK_EDIT = !BOOK_EDIT; BOOK_SEL.clear(); render(); },
  'book-sel': el => {
    const id = el.dataset.id; BOOK_SEL.has(id) ? BOOK_SEL.delete(id) : BOOK_SEL.add(id);
    el.querySelector('.check').classList.toggle('on', BOOK_SEL.has(id));
    const btn = $('[data-act=book-remove]'); if(btn){ btn.disabled = !BOOK_SEL.size; btn.textContent = removeLabel(); }
  },
  'book-remove': () => { const b = bookById(OPEN_BOOK); b.wordIds = b.wordIds.filter(id => !BOOK_SEL.has(id)); BOOK_SEL.clear(); BOOK_EDIT = false; updateFinished(); save('books'); render(); toast('已移除'); },
  'book-more': () => {
    const b = bookById(OPEN_BOOK);
    openSheet({title:b.name, body:`<div class="panel"><button class="item" data-act="book-rename"><div class="grow t">重新命名</div></button>
      <button class="item" data-act="book-delete"><div class="grow t" style="color:var(--red)">刪除單字簿</div></button></div>`, onRight: closeSheet});
  },
  'book-rename': () => { const b = bookById(OPEN_BOOK); const n = str(prompt('新名稱', b.name)); closeSheet(); if(!n || n === b.name) return; if(bookByName(n)) return toast('已有同名的單字簿'); b.name = n; save('books'); render(); },
  'book-delete': () => {
    const b = bookById(OPEN_BOOK); closeSheet();
    if(!confirm(`確定要刪除單字簿「${b.name}」嗎？`)) return;
    const only = b.wordIds.filter(id => W[id] && booksOfWord(id).length === 1);
    B = B.filter(x => x !== b);
    S.trainBooks = S.trainBooks.filter(id => id !== b.id);
    if(only.length && confirm(`其中有 ${only.length} 個字不屬於其他單字簿。要一併從總庫刪除這些字和它們的進度嗎？\n（選「取消」則保留在總庫）`)) only.forEach(deleteWord);
    OPEN_BOOK = null; saveAll(); render(); toast('已刪除單字簿');
  },
  'word-to-book': el => {
    const id = el.dataset.id, back = () => { render(); openWordSheet(id); };
    /* 加入後回到單字詳情，可看到更新後的所屬單字簿 */
    chooseBook('加入單字簿', b => { const had = b.wordIds.includes(id); if(!had) b.wordIds.push(id); updateFinished(); save('books'); toast(had ? `已在「${b.name}」裡` : `已加入「${b.name}」`); setTimeout(back, 0); },
      {onCancel: back, has: b => b.wordIds.includes(id)});
  },
  'word-delete': el => { const id = el.dataset.id; if(!confirm(`確定要從總庫刪除「${W[id].en}」嗎？學習進度也會一併刪除。`)) return; deleteWord(id); saveAll(); closeSheet(); render(); toast('已刪除'); },
  'pool-to-book': () => { const ids = poolIds(); chooseBook('收進單字簿', b => { let n = 0; ids.forEach(id => { if(!b.wordIds.includes(id)){ b.wordIds.push(id); n++; } }); updateFinished(); save('books'); toast(`已將 ${n} 個字加入「${b.name}」`); }, {defName:'我的易錯字'}); },
  'choose-book': el => {
    let b; if(el.dataset.id === '__new'){ const n = str(prompt('新單字簿名稱', chooseBook.defName || '')); if(!n) return; b = bookByName(n) || newBook(n); } else b = bookById(el.dataset.id);
    const cb = chooseBook.cb; closeSheet(); if(cb) cb(b); render();
  },
  'sheet-right': () => { if(sheetDone) sheetDone(); else closeSheet(); },
  theme: el => { S.theme = el.dataset.k; save('settings'); applyTheme(); render(); },
  toggle: el => { S[el.dataset.k] = !S[el.dataset.k]; save('settings'); render(); },
  step: el => { const k = el.dataset.k; S[k] = Math.min(+el.dataset.hi, Math.max(+el.dataset.lo, S[k] + +el.dataset.d)); save('settings'); render(); },
  'train-book': el => { const id = el.dataset.id; S.trainBooks = S.trainBooks.includes(id) ? S.trainBooks.filter(x => x !== id) : S.trainBooks.concat(id); save('settings'); render(); },
  'import-words': () => { const t = $('#import-text').value.trim(); if(!t) return toast('請先貼上 JSON 或選擇檔案'); doImportWords(t); },
  'import-file': async () => { const t = await readFile(); if(t) doImportWords(t); },
  'backup-export': () => exportBackup(),
  'export-tag': el => { EXPORT_TAG = el.dataset.k; render(); },
  'export-words': () => exportWords(EXPORT_TAG),
  'backup-copy': async () => { toast(await copyText(JSON.stringify(makeBackup())) ? '已複製備份文字' : '複製失敗，請改用匯出備份檔'); },
  'backup-import-file': async () => { const t = await readFile(); if(t) doRestore(t); },
  'backup-import-text': () => openSheet({title:'貼上文字還原', right:'取消', onRight: closeSheet,
    body:`<textarea class="code" id="restore-text" placeholder="貼上先前複製的備份文字" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>`,
    foot:`<button class="btn" data-act="restore-go">還原</button>`}),
  'restore-go': () => { const t = $('#restore-text').value.trim(); if(t) doRestore(t); },
  'reset-all': () => {
    if(!confirm('全部重設會刪除所有單字、單字簿、進度、錯字池、設定與紀錄。建議先匯出備份。確定繼續？')) return;
    if(str(prompt('請輸入「重設」兩個字以確認')) !== '重設') return toast('已取消');
    Object.values(K).forEach(k => store.del(k)); loadAll(); applyTheme(); TAB = 'home'; render(); toast('已全部重設');
  },
  /* 練習中 */
  quit: () => { if(!SES || !SES.ans || confirm('要結束這次練習嗎？已作答的進度都已儲存。')) closeSession(); },
  'quit-now': () => closeSession(),
  again: () => { const f = SES.opts.again; closeSession(); f(); },
  next: () => { if(SES && !SES.ended && SES.q && SES.q.done) nextQ(); },
  why: () => showWhy(),
  'card-next': () => { const q = SES.q; if(q.done) return; q.done = true; q.phase.onResult(q, true); save('progress','log'); nextQ(); },
  opt: el => {
    const q = SES.q; if(q.done) return;
    const ok = el.dataset.id === q.id;
    document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if(b.dataset.id === q.id) b.classList.add('right'); });
    if(!ok) el.classList.add('wrong');
    answer(ok);
  },
  tile: el => {
    const q = SES.q; if(q.done || el.classList.contains('used')) return;
    q.typed.push(+el.dataset.k); el.classList.add('used'); drawSlots(q);
    if(q.typed.length === q.target.length){
      const got = q.typed.map(k => q.target[q.order[k]]).join('');
      const ok = got.toLowerCase() === q.target.join('').toLowerCase();
      $('#slots').classList.add(ok ? 'good' : 'bad');
      answer(ok, {input: ok ? '' : got});
    }
  },
  'tile-back': () => { const q = SES.q; if(q.done || !q.typed.length) return; const k = q.typed.pop(); document.querySelector(`.tile[data-k="${k}"]`).classList.remove('used'); drawSlots(q); },
  'tile-giveup': () => { const q = SES.q; if(q.done) return; answer(false); },
  'spell-check': () => checkSpell(),
  'spell-giveup': () => { const q = SES.q; if(q.done) return; $('#spell-in').readOnly = true; answer(false); },
  mt: el => tapMatch(el)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const f = ACT[el.dataset.act]; if(f) f(el, e);
});
document.addEventListener('input', e => {
  if(e.target.id === 'lib-search'){
    SEARCH = e.target.value.trim(); renderLibList();
    /* 清單變短時，捲回清單開頭，搜尋列固定在上方 */
    const tabs = $('.stick-top') && $('.stick-top').previousElementSibling;
    if(tabs){ const y0 = tabs.offsetTop + tabs.offsetHeight; if(window.scrollY > y0) window.scrollTo(0, y0); }
  }
  if(e.target.id === 'rate'){ S.rate = +e.target.value; $('#rate-v').textContent = S.rate.toFixed(2); save('settings'); }
});
$('#s-body').addEventListener('click', e => {
  const q = SES && SES.q;
  /* 看詳解時（q.hold）點畫面不跳題，按結果列才繼續 */
  if(!q || !q.done || q.hold || SES.ended || Date.now() - (q.doneAt || 0) < 300 || e.target.closest('[data-act=speak]')) return;
  nextQ();
});
$('#kb-keep').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); if(SES && !SES.ended && SES.q && SES.q.done) nextQ(); } });
function fitSession(){
  const vv = window.visualViewport, el = $('#session'); if(!vv || el.hidden) return;
  if(vv.height < window.innerHeight - 1){ el.style.top = vv.offsetTop + 'px'; el.style.height = vv.height + 'px'; el.style.bottom = 'auto'; }
  else { el.style.top = el.style.height = el.style.bottom = ''; }
}
if(window.visualViewport){ visualViewport.addEventListener('resize', fitSession); visualViewport.addEventListener('scroll', fitSession); }
document.addEventListener('visibilitychange', () => { if(!document.hidden && !SES) render(); });

loadAll();
applyTheme();
render();
</script>
