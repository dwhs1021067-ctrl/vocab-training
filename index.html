<style>
:root{
  --paper:#F5F7F5; --surface:#FDFEFD; --ink:#2B3531; --muted:#66716B; --line:#E1E6E3;
  --green:#3D7A62; --on-green:#FFFFFF; --green-soft:#E6F0EB; --brass:#A07A2C; --brass-soft:#F5EEDD;
  --red:#C0544B; --red-soft:#FAEAE8; --ok:#2F7D52; --ok-soft:#E5F3EA;
  --serif:"Iowan Old Style","Palatino","Georgia",ui-serif,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1D2321; --surface:#262D2A; --ink:#D8DFDB; --muted:#9AA59F; --line:#36403C;
  --green:#86C2A5; --on-green:#16221D; --green-soft:#2A3B33; --brass:#D4B270; --brass-soft:#3B3426;
  --red:#E8958C; --red-soft:#432C2A; --ok:#8CCBA3; --ok-soft:#263A2E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1D2321; --surface:#262D2A; --ink:#D8DFDB; --muted:#9AA59F; --line:#36403C;
  --green:#86C2A5; --on-green:#16221D; --green-soft:#2A3B33; --brass:#D4B270; --brass-soft:#3B3426;
  --red:#E8958C; --red-soft:#432C2A; --ok:#8CCBA3; --ok-soft:#263A2E; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
/* 練習畫面或底部面板開啟時固定背景頁面，避免 iPhone 上滑動時連背景一起捲動（v1.3.0） */
body.locked{position:fixed;left:0;right:0;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
[hidden]{display:none!important}
.en{font-family:var(--serif)}

/* 主框架 */
#view{padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 92px);max-width:640px;margin:0 auto}
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--sb);z-index:10}
#tabbar button{flex:1;padding:9px 0 7px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
#tabbar button svg{width:22px;height:22px}
#tabbar button svg{padding:2px 14px;box-sizing:content-box;border-radius:14px;transition:background .2s}
#tabbar button.on{color:var(--green);font-weight:600}
#tabbar button.on svg{background:var(--green-soft)}
h1{font-size:28px;font-weight:650;margin:6px 0 2px;letter-spacing:.02em}
h2{font-size:19px;margin:28px 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0}
.small{font-size:13px;color:var(--muted)}

/* 元件 */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 18px;border-radius:14px;
  background:var(--green);color:var(--on-green);font-weight:600;font-size:17px;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--surface);color:var(--red);border:1px solid var(--line);font-weight:500}
.btn.sm{min-height:40px;font-size:15px;width:auto;border-radius:10px;padding:0 14px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.row>.btn{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .d{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);flex:none}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s ease}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;margin:14px 0}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty .btn{margin-top:16px}
textarea.code{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);
  font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.45}
.lv{display:inline-flex;gap:3px;flex:none}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lv i.f{background:var(--green)}
.lv.m i.f{background:var(--brass)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--green-soft);color:var(--green);margin:2px 4px 2px 0}
.tag.manual{background:var(--brass-soft);color:var(--brass);font-family:var(--sans);font-weight:500;font-size:11px;padding:1px 7px;margin:0 0 0 8px;vertical-align:2px;line-height:1.5}
.fld{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--line);min-height:54px}
.fld:first-child{border-top:0}
.fld>span{flex:none;width:2.6em;color:var(--muted);font-size:15px}
.fld input,.fld select{flex:1;min-width:0;border:0;background:transparent;padding:8px 0}
.fld input.en{font-family:var(--serif);font-size:19px}
.fld input[readonly]{color:var(--muted)}
.fld select{-webkit-appearance:none;appearance:none}
.note{font-size:14px;margin:10px 2px 0;color:var(--brass)}
.lib-top{display:flex;gap:10px;align-items:center}
.lib-top .search{flex:1}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on{background:var(--green);border-color:var(--green)}
.check.on::after{content:"";width:6px;height:11px;border:solid var(--on-green);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--paper);font-size:20px}
.stepper span{min-width:34px;text-align:center;font-weight:600}
.stepper button:disabled{opacity:.35}
input[type=range]{width:100%;accent-color:var(--green)}

/* 首頁 */
.today-head{display:flex;justify-content:space-between;align-items:flex-end}
.streak{text-align:right}
.streak b{font-family:var(--serif);font-size:34px;line-height:1;color:var(--brass)}
.ledger{margin:20px 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 18px}
.ledger .ln{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px dashed var(--line)}
.ledger .ln:first-child{border-top:0}
.ledger .ln b{font-family:var(--serif);font-size:24px}
.ledger .ln span{color:var(--muted)}
.start{min-height:62px;font-size:19px;border-radius:18px}
.daynote{margin-top:14px;text-align:center}

/* 練習 */
.mode{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.mode .t{font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.mode .d{color:var(--muted);font-size:14px;margin-top:3px}
.mode .n{font-family:var(--serif);font-size:22px;color:var(--green)}
.mode:disabled{opacity:.5}
.mode.main{background:var(--green-soft);border-color:transparent}
.mode.main .t{color:var(--green)}

/* 單字詳情 */
.word-card{padding:4px 0}
.word-card .w{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.word-card .w .en{font-size:34px;font-weight:600;line-height:1.15;word-break:break-word}
.word-card .pos{color:var(--muted);font-style:italic;font-family:var(--serif)}
.word-card .zh{font-size:20px;margin:6px 0 2px}
.morph{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.morph span{font-size:13px;padding:3px 10px;border-radius:8px;background:var(--brass-soft);color:var(--ink)}
.morph span em{font-style:normal;color:var(--muted);margin-right:4px}
.ex{margin-top:12px;padding:12px 14px;border-left:3px solid var(--green);background:var(--paper);border-radius:0 10px 10px 0}
.ex .e{font-family:var(--serif);font-size:16.5px;line-height:1.6}
.ex .z{color:var(--muted);font-size:14px;margin-top:4px}
.spk{width:40px;height:40px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-grid;place-items:center;flex:none}
.spk svg{width:20px;height:20px}
.spk.sm{width:32px;height:32px}
.spk.sm svg{width:16px;height:16px}

/* 底部面板 */
#sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(20,28,24,.28);display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
#sheet{background:var(--paper);width:100%;max-width:640px;max-height:calc(100% - var(--st) - 20px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head b{font-size:17px}
.sh-head button{color:var(--green);font-weight:600;min-width:44px;min-height:36px}
.sh-body{overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sheet.tall{height:calc(100% - var(--st) - 20px)}
#sheet.tall .sh-body{flex:1}
.sh-top{padding:12px 16px 0;border-bottom:1px solid var(--line);background:var(--paper)}
.sh-top .small{margin:8px 2px 10px}
.stick-top{position:sticky;top:0;z-index:5;background:var(--paper);margin:0 -18px;padding:calc(var(--st) + 8px) 18px 2px}
.stick-bottom{position:sticky;bottom:calc(var(--sb) + 70px);z-index:5;margin-top:12px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.sh-foot{padding:10px 16px calc(var(--sb) + 12px);border-top:1px solid var(--line)}

/* 練習畫面 */
#session{position:fixed;inset:0;background:var(--paper);z-index:30;display:flex;flex-direction:column;overscroll-behavior:contain}
#kb-keep{position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
.s-top{padding:calc(var(--st) + 8px) 14px 8px;display:flex;align-items:center;gap:12px}
.s-top .x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.s-top .grow{flex:1}
.s-top .bar{height:8px}
.s-top .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
#s-body{flex:1;overflow-y:auto;padding:10px 18px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-width:640px;width:100%;margin:0 auto}
#s-foot{padding:10px 18px calc(var(--sb) + 14px);max-width:640px;width:100%;margin:0 auto}
#s-foot:empty{display:none}
.stamps{display:flex;gap:5px;align-items:center;margin-bottom:14px}
.stamps i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.stamps i.f{background:var(--green)}
.stamps span{font-size:13px;color:var(--muted);margin-left:6px}
.prompt{text-align:center;padding:22px 0 18px}
.prompt .en{font-size:40px;font-weight:600;line-height:1.15;word-break:break-word}
.prompt .zh{font-size:26px;font-weight:600;line-height:1.35}
.prompt .pos{color:var(--muted);font-family:var(--serif);font-style:italic;margin-top:6px}
.prompt .hint{color:var(--muted);font-size:14px;margin-top:4px}
.opts{display:grid;gap:12px}
.opt{width:100%;min-height:58px;padding:13px 18px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-size:17px;line-height:1.4;transition:background .15s,border-color .15s}
.opt:active{background:var(--green-soft)}
.opt.en{font-size:19px}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled:not(.right){color:var(--ink)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 5px;margin:6px 0 22px}
.slots .gap{width:14px}
.slot{width:32px;height:42px;border-bottom:2.5px solid var(--line);display:grid;place-items:end center;padding-bottom:3px;font-family:var(--serif);font-size:24px;font-weight:600}
.slot.f{border-color:var(--green)}
.slots.bad .slot{border-color:var(--red);color:var(--red)}
.slots.good .slot{border-color:var(--ok);color:var(--ok)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
.tile{width:46px;height:50px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);font-family:var(--serif);font-size:23px;font-weight:600;box-shadow:0 2px 0 var(--line)}
.tile.used{visibility:hidden}
.spell{width:100%;color:var(--ink);font-family:var(--serif);font-size:24px;text-align:center;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.spell.bad{border-color:var(--red);color:var(--red)}
.spell.good{border-color:var(--ok);color:var(--ok)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mt{min-height:58px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:15.5px;line-height:1.3}
.mt.en{font-size:18px}
.mt.sel{border-color:var(--green);background:var(--green-soft)}
.mt.bad{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
.mt.done{opacity:0;pointer-events:none;transition:opacity .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mt.bad{animation:none}}
.fb{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.verdict{font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--red)}
.verdict small{font-weight:500;font-size:13px;color:var(--muted);text-align:right}
.yours{font-size:14px;color:var(--muted);margin-bottom:6px}
.yours b{font-family:var(--serif);color:var(--red);font-size:16px}
.summary{text-align:center;padding:30px 0 10px}
.summary .big{font-family:var(--serif);font-size:56px;color:var(--green);line-height:1}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.sumgrid div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.sumgrid b{display:block;font-family:var(--serif);font-size:26px}
.sumgrid span{font-size:13px;color:var(--muted)}

.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:10px 16px;border-radius:14px;font-weight:700;font-size:17px;width:100%;text-align:left}
.vbar.ok{background:var(--ok-soft);color:var(--ok)}
.vbar.no{background:var(--red-soft);color:var(--red)}
.vbar small{font-weight:500;font-size:13px;color:var(--muted);text-align:right}
.vbar .ans{display:block;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);margin-top:1px}
/* 結果列旁的「詳解」按鈕（v1.3.0） */
.fbrow{display:flex;gap:8px;align-items:stretch}
.fbrow .vbar{flex:1;min-width:0}
.why{flex:none;min-width:64px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--green);font-weight:600;font-size:15px}
/* 例句克漏字（v1.3.0） */
.cloze{font-family:var(--serif);font-size:21px;line-height:1.7;padding:18px 2px 6px}
.cloze .blank{display:inline-block;min-width:4.2em;border-bottom:2.5px solid var(--green);text-align:center;line-height:1.2;margin:0 2px}
.cloze .blank.good{color:var(--ok);border-color:var(--ok);font-weight:600}
.cloze .blank.bad{color:var(--red);border-color:var(--red);font-weight:600}
.cloze-zh{color:var(--muted);font-size:15px;margin:6px 2px 4px;min-height:1.5em}
.stat-line{display:flex;gap:18px;margin:14px 0 18px;color:var(--muted);font-size:14px}
.stat-line b{font-family:var(--serif);font-size:20px;color:var(--ink);margin-right:3px}
/* 綜合精通範圍面板的整體統計（v1.3.1） */
.scope-sum{margin-bottom:14px;padding:4px 16px}
.scope-sum .stat-line{margin:10px 0}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--paper);box-shadow:0 4px 14px rgba(0,0,0,.15);
  padding:10px 16px;border-radius:12px;font-size:15px;z-index:60;max-width:86%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.result{margin-top:10px;font-size:14px;white-space:pre-wrap}
.lbl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-height:56px}
.lbl:first-child{border-top:0}
.lbl .grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 14px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);font-size:14px;background:var(--paper)}
.chip.on{background:var(--green);color:var(--on-green);border-color:var(--green)}

/* 統計頁 */
.stack{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 0}
.stack i{display:block;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.grp{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.lvdist{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);text-align:center}
.lvdist b{display:block;font-family:var(--serif);font-size:18px}
.lvdist span{font-size:11px;color:var(--muted)}
.chart{display:flex;align-items:stretch;gap:3px;height:132px}
.chart .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0;border-radius:6px}
.chart .col i{display:block;width:72%;max-width:20px;background:var(--green);border-radius:4px 4px 0 0;opacity:.55}
.chart .col i.zero{height:2px!important;background:var(--line);opacity:1;border-radius:1px}
.chart .col.now i,.chart .col.sel i{opacity:1}
.chart .col.sel{background:var(--green-soft)}
.chart .cv{font-size:11px;color:var(--ink);min-height:16px;line-height:16px}
.chart .cl{font-size:11px;color:var(--muted);margin-top:4px;line-height:14px;border-top:1px solid var(--line);width:100%;padding-top:3px}
.chart .col.now .cl{color:var(--ink);font-weight:600}
.cap{margin:8px 4px 2px;min-height:20px}
.item:disabled{opacity:.6}
</style>
</head>
<body>

  <button data-act="tab" data-tab="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/><path d="M8 7h7M8 10.5h5"/></svg>單字</button>
  <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>統計</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>設定</button>
</nav>

<section id="session" hidden>
  <input id="kb-keep" type="text" tabindex="-1" aria-hidden="true" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next">
  <div class="s-top">
    <button class="x" data-act="quit" aria-label="結束練習"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="grow"><div class="lab"><span id="s-label"></span><span id="s-count"></span></div><div class="bar"><i id="s-bar" style="width:0"></i></div></div>
  </div>

<div id="sheet-wrap" hidden><div id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="file-in" accept=".json,application/json,text/plain" hidden>

<script>
'use strict';
/* ========== 常數 ========== */
const APP_VERSION = '1.5.0';
const BACKUP_VERSION = 1;
const K = {words:'vocab_words', books:'vocab_books', progress:'vocab_progress', pool:'vocab_wrongPool', settings:'vocab_settings', log:'vocab_log'};
const DEF_SETTINGS = {dailyNew:10, batchSize:8, linkCount:20, autoSpeak:true, rate:0.9, trainBooks:[], skipWarmup:false, theme:'auto', drawCount:40, tagMigrated:false, speakOnCorrect:true};
const TAGS = [['toeic','多益'],['dipl','外特']];
const TAG_NAME = Object.fromEntries(TAGS);
const INTERVALS = [1,2,4,7,15,30,60,120];   /* v1.4.0 加上 60、120 天兩階，減少長期複習量 */
const LV_NAME = ['暖身','視覺辨識','雙向連接','結構重組','主動輸出','精通'];
const TYPE_BY_LV = ['card','en2zh','zh2en','letters','spell'];
const POOL_CAP = 20;
const CLOZE_COUNT = 20;          /* 例句克漏字每次題數（v1.3.0） */
const LEECH_AT = 3;              /* 遺忘曲線複習累計答錯幾次收進「頑固字」（v1.3.0） */
const LEECH_BOOK = '頑固字';
const REVIEW_BACK = 2;           /* 複習答錯時間隔退回幾階（v1.3.0） */
const ICON_SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>';

/* ========== 儲存 ========== */
const memStore = {};
const store = {
  get(k, def){
    try{ const v = localStorage.getItem(k); if(v == null) return k in memStore ? memStore[k] : def; return JSON.parse(v); }
    catch(e){ return k in memStore ? memStore[k] : def; }
  },
  set(k, v){
    memStore[k] = v;
    try{ localStorage.setItem(k, JSON.stringify(v)); }
    catch(e){ toast('無法寫入本機儲存空間，請先匯出備份'); }
  },
  del(k){ delete memStore[k]; try{ localStorage.removeItem(k); }catch(e){} }
};
let W = {}, B = [], P = {}, POOL = [], S = {}, L = {};

const str = v => v == null ? '' : String(v).trim();
const clampInt = (v, lo, hi, d) => { v = parseInt(v, 10); return isNaN(v) ? d : Math.min(hi, Math.max(lo, v)); };

function normProg(p){
  p = p && typeof p === 'object' ? p : {};
  const level = clampInt(p.level, 0, 5, 0);
  const srs = p.srs && p.srs.due ? {stage: clampInt(p.srs.stage, 0, INTERVALS.length-1, 0), due: String(p.srs.due)} : null;
  /* confirmedAt：通過第一次遺忘曲線複習的時間，之後才算「精通」（v1.3.0）。
     舊資料中 stage ≥ 1 的字代表已答對過複習，視為已確認。 */
  let confirmedAt = p.confirmedAt || null;
  if(!confirmedAt && level >= 5 && srs && srs.stage >= 1) confirmedAt = +p.lastSeen || Date.now();
  return {
    level,
    typeStats: p.typeStats && typeof p.typeStats === 'object' ? p.typeStats : {},
    wrongTotal: +p.wrongTotal || 0,
    lastSeen: +p.lastSeen || 0,
    srs,
    learnedAt: p.learnedAt || null,
    confirmedAt: level >= 5 ? confirmedAt : null,
    revWrong: +p.revWrong || 0
  };
}
function normBook(b){
  return {id: str(b.id) || uid('b'), name: str(b.name) || '未命名單字簿', wordIds: Array.isArray(b.wordIds) ? b.wordIds.map(String) : [],
    createdAt: +b.createdAt || Date.now(), finishedAt: b.finishedAt || null};
}
function normalizeAll(){
  if(Array.isArray(W)){ const o = {}; W.forEach(w => { if(w && w.id) o[w.id] = w; }); W = o; }
  if(!W || typeof W !== 'object') W = {};
  for(const id in W){ const w = W[id]; if(!w || typeof w !== 'object') continue; if(w.tags == null) delete w.tags; else w.tags = normTags(w.tags); }
  B = Array.isArray(B) ? B.filter(b => b && typeof b === 'object').map(normBook) : [];
  if(!P || typeof P !== 'object') P = {};
  for(const id in P) P[id] = normProg(P[id]);
  POOL = Array.isArray(POOL) ? POOL.filter(x => x && x.wordId).map(x => ({wordId:String(x.wordId), addedAt:+x.addedAt||Date.now(), streak:clampInt(x.streak,0,3,0)})) : [];
  S = Object.assign({}, DEF_SETTINGS, S && typeof S === 'object' ? S : {});
  if(!Array.isArray(S.trainBooks)) S.trainBooks = [];
  S.dailyNew = clampInt(S.dailyNew, 0, 50, 10); S.batchSize = clampInt(S.batchSize, 5, 15, 8); S.linkCount = clampInt(S.linkCount, 5, 100, 20);
  S.rate = Math.min(1.2, Math.max(0.5, +S.rate || 0.9)); S.autoSpeak = S.autoSpeak !== false; S.speakOnCorrect = S.speakOnCorrect !== false; S.skipWarmup = S.skipWarmup === true;
  if(!['auto','light','dark'].includes(S.theme)) S.theme = 'auto';
  S.drawCount = Math.min(80, Math.max(16, Math.round((+S.drawCount || 40) / 8) * 8)); S.tagMigrated = S.tagMigrated === true;
  if(!L || typeof L !== 'object') L = {};
}
function loadAll(){
  W = store.get(K.words, {}); B = store.get(K.books, []); P = store.get(K.progress, {});
  POOL = store.get(K.pool, []); S = store.get(K.settings, {}); L = store.get(K.log, {});
  normalizeAll(); migrateTags();
}
/* 分組標籤（v1.1） */
function normTags(t){
  const arr = Array.isArray(t) ? t : [t], got = new Set(arr.map(x => str(x).toLowerCase()));
  return TAGS.map(x => x[0]).filter(k => got.has(k));
}
/* 一次性轉換：沒有 tags、也不是手動新增的字標為多益；總庫為空時不執行，等有字再轉 */
function migrateTags(){
  if(S.tagMigrated) return 0;
  const ids = Object.keys(W); if(!ids.length) return 0;
  let n = 0;
  ids.forEach(id => { const w = W[id]; if(!Array.isArray(w.tags) && !w.manual){ w.tags = ['toeic']; n++; } });
  S.tagMigrated = true; save('words','settings');
  return n;
}
function save(...keys){
  const map = {words:W, books:B, progress:P, pool:POOL, settings:S, log:L};
  keys.forEach(k => store.set(K[k], map[k]));
}
const saveAll = () => save('words','books','progress','pool','settings','log');
const THEME_BG = {light:'#F5F7F5', dark:'#1D2321'};
function applyTheme(){
  const r = document.documentElement, t = S.theme || 'auto';
  if(t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  document.querySelectorAll('meta[name=theme-color]').forEach(m => {
    if(!m.dataset.media) m.dataset.media = m.getAttribute('media') || '';
    if(t === 'auto'){ m.setAttribute('media', m.dataset.media); m.setAttribute('content', /dark/.test(m.dataset.media) ? THEME_BG.dark : THEME_BG.light); }
    else { m.removeAttribute('media'); m.setAttribute('content', THEME_BG[t]); }
  });
}

/* ========== 工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const shuffle = a => { for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
function dkey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const today = () => dkey(new Date());
function addDays(key, n){ const [y,m,d] = key.split('-').map(Number); return dkey(new Date(y, m-1, d+n)); }
function normAns(s){ return str(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[‐‑–—]/g,'-').replace(/\s+/g,' '); }
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }

/* 固定背景頁面（v1.3.0）：iPhone 的 Safari 不理會 overflow:hidden，練習畫面或面板開啟時把 body 固定住，關閉時回到原本位置 */
const LOCK = {session:false, sheet:false, y:0};
function setLock(kind, on){
  const was = LOCK.session || LOCK.sheet;
  LOCK[kind] = on;
  const now = LOCK.session || LOCK.sheet, b = document.body;
  if(now && !was){ LOCK.y = window.scrollY || 0; b.style.top = -LOCK.y + 'px'; b.classList.add('locked'); }
  else if(!now && was){ b.classList.remove('locked'); b.style.top = ''; window.scrollTo(0, LOCK.y); }
}

/* ========== 資料操作 ========== */
const prog = id => P[id] || (P[id] = normProg());
const lvl = id => P[id] ? P[id].level : 0;
/* 精通＝完成五關且通過第一次複習；完成五關但還沒通過第一次複習為「待確認」（v1.3.0） */
const isMastered = id => !!(P[id] && P[id].level >= 5 && P[id].confirmedAt);
const isPending = id => !!(P[id] && P[id].level >= 5 && !P[id].confirmedAt);
const bookById = id => B.find(b => b.id === id);
const bookByName = n => B.find(b => b.name === n);
function newBook(name){ const b = normBook({id:uid('b'), name}); B.push(b); return b; }
function bookStats(b){
  const ids = b.wordIds.filter(id => W[id]);
  let mastered = 0, learned = 0, pending = 0;
  ids.forEach(id => { const l = lvl(id); if(isMastered(id)) mastered++; else if(l >= 5) pending++; if(l >= 1 || (P[id] && P[id].learnedAt)) learned++; });
  return {total: ids.length, mastered, pending, learned};
}
function updateFinished(){
  B.forEach(b => { const s = bookStats(b); if(s.total && s.mastered === s.total){ if(!b.finishedAt) b.finishedAt = Date.now(); } else b.finishedAt = null; });
}
function logDay(){ const t = today(); return L[t] || (L[t] = {n:0, c:0, nw:0, t:{}, sp:{s:0,m:0,e:0}}); }
const todayLog = () => L[today()] || {n:0, c:0, nw:0};
function addToPool(id){
  const e = POOL.find(x => x.wordId === id);
  if(e) e.streak = 0; else POOL.push({wordId:id, addedAt:Date.now(), streak:0});
}
function record(id, type, ok){
  const p = prog(id);
  const ts = p.typeStats[type] || (p.typeStats[type] = {c:0, w:0});
  ok ? ts.c++ : ts.w++;
  if(!ok) p.wrongTotal++;
  p.lastSeen = Date.now();
  const d = logDay(); d.n++; if(ok) d.c++;
  const dt = d.t[type] || (d.t[type] = {c:0, w:0}); ok ? dt.c++ : dt.w++;
  if(!ok) addToPool(id);
}
function recordSpellPos(correct, input){
  const a = normAns(correct), b = normAns(input);
  if(!b || !a) return;
  let i = 0; while(i < a.length && a[i] === b[i]) i++;
  if(i >= a.length) i = a.length - 1;
  const r = i / a.length, d = logDay();
  d.sp = d.sp || {s:0,m:0,e:0};
  d.sp[r < 1/3 ? 's' : r < 2/3 ? 'm' : 'e']++;
}
function dueIds(){ const t = today(); return Object.keys(W).filter(id => { const p = P[id]; return p && p.level >= 5 && p.srs && p.srs.due <= t; }); }
function poolIds(){ return POOL.map(x => x.wordId).filter(id => W[id]); }
function streakDays(){
  let k = today(), n = 0;
  if(!(L[k] && L[k].n)) k = addDays(k, -1);
  while(L[k] && L[k].n){ n++; k = addDays(k, -1); }
  return n;
}
function scopeIds(bookIds){
  if(bookIds.includes('__all')) return Object.keys(W);
  const set = new Set(), out = [];
  bookIds.forEach(bid => { const b = bookById(bid); if(b) b.wordIds.forEach(id => { if(W[id] && !set.has(id)){ set.add(id); out.push(id); } }); });
  return out;
}
function booksOfWord(id){ return B.filter(b => b.wordIds.includes(id)); }
function scopeOfWord(id){ const s = scopeIds(booksOfWord(id).map(b => b.id)); return s.length ? s : Object.keys(W); }
function buildBatch(scope, size, newCap){
  const inProg = scope.filter(id => { const p = P[id]; return p && p.level < 5 && (p.level >= 1 || p.learnedAt); })
                      .sort((a,b) => (P[a].lastSeen||0) - (P[b].lastSeen||0));
  const batch = inProg.slice(0, size);
  let room = Math.min(size - batch.length, newCap);
  for(const id of scope){ if(room <= 0) break; const p = P[id]; if(!p || (p.level === 0 && !p.learnedAt)){ batch.push(id); room--; } }
  return batch;
}
/* 形近字分數（v1.3.0）：同字首、同字尾或拼法相近的字分數較高，用來當英文選項的干擾項 */
function editDist(a, b){
  if(Math.abs(a.length - b.length) > 3) return 9;
  let prev = Array.from({length: b.length + 1}, (_, j) => j);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function simScore(a, b){
  a = a.toLowerCase(); b = b.toLowerCase();
  if(a === b || a.includes(' ') !== b.includes(' ')) return 0;
  let pre = 0; while(pre < a.length && pre < b.length && a[pre] === b[pre]) pre++;
  let suf = 0; while(suf < a.length - pre && suf < b.length - pre && a[a.length-1-suf] === b[b.length-1-suf]) suf++;
  /* 一個字完全包含在另一個字的開頭（如 diplomat／diplomatic）屬衍生字，不算形近 */
  if(pre >= Math.min(a.length, b.length)) return 0;
  const d = editDist(a, b), len = Math.max(a.length, b.length);
  let s = 0;
  if(pre >= 3) s += pre;
  if(suf >= 3) s += suf - 1;
  if(d <= 2 && len >= 5) s += 4 - d;
  return s;
}
/* similar 為 true 時（選項是英文的題型），先放最多 2 個形近字，其餘照原本規則抽取 */
function distractors(id, n, scope, similar = false){
  const w = W[id], usedEn = new Set([normAns(w.en)]), usedZh = new Set([w.zh]), out = [];
  const all = Object.keys(W);
  const take = x => { const o = W[x]; if(!o || x === id || usedEn.has(normAns(o.en)) || usedZh.has(o.zh)) return false;
    usedEn.add(normAns(o.en)); usedZh.add(o.zh); out.push(x); return true; };
  if(similar){
    const pool = w.pos ? all.filter(x => W[x].pos === w.pos) : all;
    const ranked = pool.map(x => [x, simScore(w.en, W[x].en)]).filter(r => r[1] >= 3).sort((a, b) => b[1] - a[1]).slice(0, 6).map(r => r[0]);
    for(const x of shuffle(ranked)){ if(out.length >= Math.min(2, n)) break; take(x); }
  }
  const tiers = w.pos ? [scope.filter(x => W[x] && W[x].pos === w.pos), scope, all.filter(x => W[x].pos === w.pos), all] : [scope, all];
  for(const t of tiers){
    for(const x of shuffle(t.slice())){ if(out.length >= n) break; take(x); }
    if(out.length >= n) break;
  }
  return out;
}
function deleteWord(id){
  delete W[id]; delete P[id];
  POOL = POOL.filter(x => x.wordId !== id);
  B.forEach(b => b.wordIds = b.wordIds.filter(x => x !== id));
}

const enKey = en => str(en).toLowerCase().replace(/\s+/g,' ');
const makeId = en => 'w_' + enKey(en).replace(/ /g,'-');
function findByEn(en){ const k = enKey(en); if(W[makeId(en)]) return makeId(en); return Object.keys(W).find(id => enKey(W[id].en) === k) || null; }
function normZh(s){ return str(s).split(/[,，、;；]+/).map(x => x.trim()).filter(Boolean).join('；'); }
const isManual = id => !!(W[id] && W[id].manual);
const manualTag = id => isManual(id) ? '<span class="tag manual">手動</span>' : '';
const manualIds = () => Object.keys(W).filter(isManual);
const tagsOf = id => W[id] && Array.isArray(W[id].tags) ? W[id].tags : [];
const hasTag = (id, t) => tagsOf(id).includes(t);
const tagsHTML = id => tagsOf(id).length ? tagsOf(id).map(k => `<span class="tag">${TAG_NAME[k]}</span>`).join('') : '<span class="small">未分組</span>';
function setBooksOf(id, sel){
  B.forEach(b => { const has = b.wordIds.includes(id);
    if(sel.has(b.id) && !has) b.wordIds.push(id);
    if(!sel.has(b.id) && has) b.wordIds = b.wordIds.filter(x => x !== id); });
}

        const ex = findByEn(enV);
        if(ex){
          sel.forEach(bid => { const b = bookById(bid); if(b && !b.wordIds.includes(ex)) b.wordIds.push(ex); });
          if(tagSel.size) W[ex].tags = normTags(tagsOf(ex).concat([...tagSel]));

        sel.forEach(bid => { const b = bookById(bid); if(b) b.wordIds.push(id); });

    }});
}

/* ========== 匯入單字 ========== */
function importWords(arr){
  if(!Array.isArray(arr)) throw new Error('最外層必須是陣列，也就是以 [ 開頭、以 ] 結尾。');
  let added = 0, updated = 0, tagged = 0, tagSame = 0; const skipped = [], replaced = [], badTags = new Set();
  const readTags = v => { (Array.isArray(v) ? v : [v]).forEach(x => { const k = str(x).toLowerCase(); if(k && !TAG_NAME[k]) badTags.add(str(x)); }); return normTags(v); };
  arr.forEach((r, i) => {
    if(!r || typeof r !== 'object'){ skipped.push(`第 ${i+1} 筆：不是物件`); return; }
    const id = str(r.id), en = str(r.en), zh = str(r.zh), pos = str(r.pos);
    const hasTagsField = r.tags != null && r.tags !== '';
    /* 標記用條目：只有 id 與 tags，只加分組標籤，不動內容與進度 */
    if(id && hasTagsField && !en && !zh && !pos){
      const tg = readTags(r.tags);
      if(!W[id]){ skipped.push(`第 ${i+1} 筆（${id}）：總庫沒有這個字`); return; }
      if(!tg.length){ skipped.push(`第 ${i+1} 筆（${id}）：沒有可辨識的分組標籤`); return; }
      const old = tagsOf(id), u = normTags(old.concat(tg));
      if(u.length === old.length) tagSame++;
      W[id].tags = u; tagged++; return;
    }
    if(!id || !en || !zh || !pos){
      const miss = [['id',id],['en',en],['zh',zh],['pos',pos]].filter(x => !x[1]).map(x => x[0]).join('、');
      skipped.push(`第 ${i+1} 筆${en ? `（${en}）` : ''}：缺少 ${miss}`); return;
    }
    const w = {id, en, zh, pos};
    if(str(r.example)) w.example = str(r.example);
    if(str(r.exampleZh)) w.exampleZh = str(r.exampleZh);
    if(r.morph && typeof r.morph === 'object'){
      const m = {prefix:str(r.morph.prefix), root:str(r.morph.root), suffix:str(r.morph.suffix)};
      if(m.prefix || m.root || m.suffix) w.morph = m;
    }
    const newTags = hasTagsField ? readTags(r.tags) : [];
    if((W[id] && Array.isArray(W[id].tags)) || newTags.length) w.tags = normTags(tagsOf(id).concat(newTags));
    if(W[id] && W[id].manual) replaced.push(en);
    W[id] ? updated++ : added++;
    W[id] = w;
  });
  migrateTags(); save('words');
  return {added, updated, skipped, replaced, tagged, tagSame, badTags:[...badTags]};
}

/* ========== 備份 ========== */
function makeBackup(){
  return {app:'vocab', backupVersion:BACKUP_VERSION, appVersion:APP_VERSION, exportedAt:new Date().toISOString(),
    data:{words:W, books:B, progress:P, wrongPool:POOL, settings:S, log:L}};
}
function restoreBackup(obj){
  if(!obj || typeof obj !== 'object' || !obj.data || obj.app !== 'vocab') throw new Error('這不是單字練習App的備份檔。若要加入單字，請改用「匯入單字」。');
  if((+obj.backupVersion||0) > BACKUP_VERSION) throw new Error('這份備份來自較新版本的App，請先更新App再匯入。');
  const d = obj.data;
  W = d.words || {}; B = d.books || []; P = d.progress || {}; POOL = d.wrongPool || []; S = d.settings || {}; L = d.log || {};
  normalizeAll(); migrateTags(); updateFinished(); saveAll(); applyTheme();
}
async function exportBackup(){ await shareFile(JSON.stringify(makeBackup()), `vocab-backup-${today()}.json`); }
/* 匯出單字庫（v1.5.0）：只含單字內容，格式與匯入格式相同，修正後可直接匯入覆蓋（同 id 保留進度） */
const EXPORT_FIELDS = ['id','en','zh','pos','example','exampleZh','morph','tags'];
function wordsForExport(tag){
  return Object.keys(W).filter(id => tag === 'all' || hasTag(id, tag)).sort().map(id => {
    const w = W[id], o = {};
    EXPORT_FIELDS.forEach(k => { if(w[k] != null && w[k] !== '') o[k] = w[k]; });
    if(!o.pos) o.pos = '';                 /* 手動新增的字可能沒有詞性 */
    if(w.manual) o.manual = true;          /* 匯入時會忽略，僅供檢查時辨識手動字 */
    return o;
  });
}
async function exportWords(tag){
  const list = wordsForExport(tag);
  if(!list.length) return toast(tag === 'all' ? '總庫還沒有單字' : `「${TAG_NAME[tag]}」分組沒有單字`);
  const text = '[\n' + list.map(o => '  ' + JSON.stringify(o)).join(',\n') + '\n]\n';
  await shareFile(text, `vocab-words-${tag === 'all' ? 'all' : tag}-${today()}.json`);
}
async function shareFile(text, name){
  try{
    const file = new File([text], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
  }
}

/* ========== 發音 ========== */
let VOICE = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
  VOICE = vs.find(v => /Samantha|Ava|Allison|Susan/i.test(v.name)) || vs.find(v => v.localService) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, onEnd){
  if(!('speechSynthesis' in window) || !text){ if(onEnd) onEnd(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = S.rate || 0.9; if(VOICE) u.voice = VOICE;
  if(onEnd){ u.onend = onEnd; u.onerror = onEnd; }
  try{ speechSynthesis.speak(u); }catch(e){ if(onEnd) onEnd(); }
}
const autoSpeak = t => { if(S.autoSpeak) speak(t); };
/* 答對時唸出單字；回傳「播完」的 Promise（最多等 3 秒），讓跳題等發音結束 */
function speakCorrect(text){
  if(!S.speakOnCorrect || !text) return null;
  return new Promise(res => { let done = false; const fin = () => { if(!done){ done = true; res(); } };
    speak(text, fin); setTimeout(fin, 3000); });
}

function viewHome(){

  if(!n) return `<p class="sub">${dateStr}</p><h1>練習</h1>

    <button class="btn" data-act="goto-import">匯入單字</button><button class="btn ghost" data-act="add-word" style="margin-top:10px">手動新增單字</button></div>`;
  const due = dueIds().length, pool = poolIds().length, tl = todayLog(), st = streakDays(), cz = clozeIds().length;
  const unmastered = Object.keys(W).filter(id => lvl(id) < 5).length;

`;

/* ========== 統計頁 ========== */
let ERR_TAB = 'pool';
let EXPORT_TAG = 'all';   /* 匯出單字庫的分組選擇，不存檔（v1.5.0） */
const TYPE_LABEL = {en2zh:'英選中', zh2en:'中選英', match:'配對', letters:'字母重組', spell:'拼寫', cloze:'例句克漏字'};
const isLearned = id => lvl(id) >= 1 || !!(P[id] && P[id].learnedAt);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const mmdd2 = key => { const [, m, d] = key.split('-').map(Number); return `${m}/${d}`; };
const WEEK = '日一二三四五六';
const weekday = key => { const [y, m, d] = key.split('-').map(Number); return WEEK[new Date(y, m-1, d).getDay()]; };
function progressOf(ids){
  let m = 0, pd = 0, l = 0; ids.forEach(id => { if(isMastered(id)) m++; else if(lvl(id) >= 5) pd++; else if(isLearned(id)) l++; });
  return {total: ids.length, mastered: m, pending: pd, learning: l, fresh: ids.length - m - pd - l};
}
const PENDING_C = 'color-mix(in srgb,var(--brass) 45%,transparent)';
function stackHTML(pr){
  if(!pr.total) return '<div class="stack"><i style="flex:1;background:var(--line)"></i></div>';
  return `<div class="stack" role="img" aria-label="精通 ${pr.mastered}、待確認 ${pr.pending}、學習中 ${pr.learning}、未學 ${pr.fresh}">${[[pr.mastered,'var(--brass)'],[pr.pending,PENDING_C],[pr.learning,'var(--green)'],[pr.fresh,'var(--line)']]
    .filter(x => x[0]).map(([n, c]) => `<i style="flex:${n};background:${c}"></i>`).join('')}</div>`;
}
/* 長條圖：單一數列，點長條在下方顯示數字 */
function colsHTML(id, cols, cap){
  const max = Math.max(1, ...cols.map(c => c.v));
  return `<div class="chart" id="${id}">${cols.map((c, i) => `<button class="col ${c.now ? 'now' : ''}" data-act="col" data-chart="${id}" data-i="${i}" aria-label="${esc(c.tip)}">
      <span class="cv">${c.show ? c.v : ''}</span><i style="height:${c.v ? Math.max(4, c.v / max * 100) : 0}%" class="${c.v ? '' : 'zero'}"></i><span class="cl">${esc(c.label)}</span></button>`).join('')}</div>
    <p class="small cap" id="${id}-cap">${esc(cap)}</p>`;
}
const CHART_TIPS = {};
function viewStats(){
  const ids = Object.keys(W);
  if(!ids.length) return `<h1>統計</h1><div class="empty">總庫還沒有單字。匯入單字並開始練習後，這裡會顯示學習進度與常錯的字。</div>`;
  const t = today(), all = progressOf(ids);
  let n = 0, c = 0; const ty = {}, sp = {s:0, m:0, e:0};
  Object.values(L).forEach(d => { n += d.n || 0; c += d.c || 0;
    Object.entries(d.t || {}).forEach(([k, v]) => { const x = ty[k] || (ty[k] = {c:0, w:0}); x.c += v.c || 0; x.w += v.w || 0; });
    if(d.sp) ['s','m','e'].forEach(k => sp[k] += d.sp[k] || 0); });
  /* 近 14 天作答 */
  const days = [];
  for(let i = 13; i >= 0; i--){ const k = addDays(t, -i), d = L[k] || {};
    days.push({v: d.n || 0, now: i === 0, label: i === 0 ? '今' : String(+k.slice(8)), tip: `${mmdd2(k)}（${weekday(k)}）作答 ${d.n || 0} 題${d.n ? `，正確率 ${pct(d.c, d.n)}%` : ''}`}); }
  const dmax = Math.max(...days.map(d => d.v)); let shown = false;
  days.forEach(d => { if(d.now || (!shown && d.v === dmax && d.v)){ d.show = true; if(!d.now) shown = true; } });
  CHART_TIPS['ch-days'] = days.map(d => d.tip);
  /* 未來 7 天到期複習（今天含逾期） */
  const due = Array(7).fill(0);
  ids.forEach(id => { const p = P[id]; if(!p || p.level < 5 || !p.srs) return;
    for(let i = 0; i < 7; i++){ if(i === 0 ? p.srs.due <= t : p.srs.due === addDays(t, i)){ due[i]++; break; } } });
  const fut = due.map((v, i) => { const k = addDays(t, i); return {v, show: true, now: i === 0, label: i === 0 ? '今' : weekday(k), tip: `${i === 0 ? '今天（含逾期）' : `${mmdd2(k)}（${weekday(k)}）`}到期 ${v} 個字`}; });
  CHART_TIPS['ch-due'] = fut.map(d => d.tip);
  /* 等級分布 */
  const lvCount = [0,0,0,0,0,0]; ids.forEach(id => lvCount[lvl(id)]++);
  /* 常錯 */
  const pool = poolIds();
  const worst = ids.filter(id => P[id] && P[id].wrongTotal > 0).sort((a, b) => P[b].wrongTotal - P[a].wrongTotal || (P[b].lastSeen||0) - (P[a].lastSeen||0)).slice(0, 20);
  const wordRow = (id, right) => `<button class="item" data-act="word-stat" data-id="${id}"><div class="grow"><div class="t en">${esc(W[id].en)}${manualTag(id)}</div><div class="d">${esc(W[id].pos)} ${esc(W[id].zh)}</div></div>${right}</button>`;
  const errBody = ERR_TAB === 'pool'
    ? (pool.length ? `<p class="small" style="margin:0 2px 8px">共 ${pool.length} 個字。小圓點是目前連續答對次數，連續答對 3 次就移出。</p>
        <div class="panel">${pool.map(id => { const e = POOL.find(x => x.wordId === id);
          return wordRow(id, `<span class="lv">${[1,2,3].map(i => `<i class="${i<=e.streak?'f':''}"></i>`).join('')}</span>`); }).join('')}</div>
        <div class="row" style="margin-top:12px"><button class="btn sm" data-act="start-pool">練習錯字</button><button class="btn sm ghost" data-act="pool-to-book">全部收進單字簿</button></div>`
      : `<div class="empty" style="padding:22px 12px">錯字池是空的。練習中答錯的字會自動放進來。</div>`)
    : (worst.length ? `<p class="small" style="margin:0 2px 8px">累計答錯次數最多的前 ${worst.length} 個字（含已移出錯字池的字）。</p>
        <div class="panel">${worst.map(id => wordRow(id, `<span class="small" style="flex:none">錯 ${P[id].wrongTotal} 次</span>`)).join('')}</div>`
      : `<div class="empty" style="padding:22px 12px">還沒有答錯過的字。</div>`);
  const groups = TAGS.map(([k, name]) => [name, progressOf(ids.filter(id => hasTag(id, k)))]).filter(g => g[1].total);
  const types = Object.keys(TYPE_LABEL).filter(k => ty[k] && ty[k].c + ty[k].w);
  const spT = sp.s + sp.m + sp.e;
  return `<h1>統計</h1>
    <div class="stat-line"><span><b>${streakDays()}</b>連續天數</span><span><b>${n}</b>累計作答</span><span><b>${n ? pct(c, n) + '%' : '—'}</b>正確率</span></div>

    <h2 style="margin-top:8px">學習進度</h2>
    <div class="panel" style="padding:14px 16px">
      <div class="row" style="justify-content:space-between;align-items:baseline"><span>總庫 ${all.total} 字</span><span class="small">精通 ${pct(all.mastered, all.total)}%</span></div>
      ${stackHTML(all)}
      <div class="legend"><span><i style="background:var(--brass)"></i>精通 ${all.mastered}</span><span><i style="background:${PENDING_C}"></i>待確認 ${all.pending}</span><span><i style="background:var(--green)"></i>學習中 ${all.learning}</span><span><i style="background:var(--line)"></i>未學 ${all.fresh}</span></div>
      ${groups.map(([name, pr]) => `<div class="grp"><div class="row" style="justify-content:space-between"><span>${name}</span><span class="small">精通 ${pr.mastered}／待確認 ${pr.pending}／學習中 ${pr.learning}／共 ${pr.total}</span></div>${stackHTML(pr)}</div>`).join('')}
      <div class="lvdist">${lvCount.map((v, i) => `<div><b>${v}</b><span>Lv ${i}</span></div>`).join('')}</div>
      <p class="small" style="margin:12px 0 0">「待確認」是完成五關、但還沒通過第一次複習的字；第一次複習答對後才算精通。</p>

/* ========== 練習流程 ========== */
let SES = null;

const STAGE_NAME = ['暖身','英選中','中選英','字母重組','拼寫'];
function chunkEven(a, max){
  const n = Math.ceil(a.length / max), out = []; let i = 0;
  for(let k = 0; k < n; k++){ const sz = Math.ceil((a.length - i) / (n - k)); out.push(a.slice(i, i + sz)); i += sz; }
  return out;
}
/* 綜合精通：同一組字逐關進行（暖身 → 英選中 → 中選英 → 配對 → 字母重組 → 拼寫） */
function MasteryPhase(batch, scope, opts = {}){
  return {
    kind:'mastery', label:'綜合精通', batch, scope, group: opts.group || 1,
    carry: (opts.carry || []).filter(id => W[id]), carryAt:[3, 10], asked:0,
    stage:-1, queue:[], deferred:[], stageTotal:0, stageDone:0, stageErr:{}, errs:{}, matchQ:[], matched:false, last:null,
    startStage(){
      for(;;){
        const defIds = new Set(this.deferred.flat().map(x => x.id));
        const pend = this.batch.filter(id => W[id] && lvl(id) < 5 && !defIds.has(id));
        if(!pend.length){
          if(!this.deferred.length) return false;
          this.queue = this.deferred.flat(); this.deferred = []; this.stageTotal = 0; return true;
        }
        const st = Math.min(...pend.map(lvl));
        const ids = shuffle(pend.filter(id => lvl(id) === st));
        if(st === 0 && S.skipWarmup){
          ids.forEach(id => { const p = prog(id); if(!p.learnedAt){ p.learnedAt = Date.now(); logDay().nw++; SES.newL++; } p.level = 1; });
          save('progress','log'); continue;
        }
        if(st >= 3 && !this.matched){
          this.matched = true;
          const m = this.batch.filter(id => W[id]);
          if(m.length >= 3){ this.matchQ = chunkEven(shuffle(m.slice()), 5); return true; }
        }
        this.stage = st; this.stageTotal = ids.length; this.stageDone = 0;
        this.queue = ids.map(id => ({id, type: TYPE_BY_LV[st]}));
        if(this.queue.length > 1 && this.queue[0].id === this.last) this.queue.push(this.queue.shift());
        let pos = 2;
        this.deferred.forEach(g => { g.forEach((it, k) => { const at = Math.min(pos + k*3, this.queue.length); this.queue.splice(at, 0, it); }); pos += 1; });
        this.deferred = [];
        return true;
      }
    },
    /* 預先判斷下一題題型（不改變出題狀態）；只在確定時回傳 */
    peek(){
      if(this.carry.length && this.carryAt.length && this.asked >= this.carryAt[0]) return this.carryType || (this.carryType = pick(['zh2en','spell']));
      if(this.matchQ.length) return 'match';
      if(this.queue.length) return this.queue[0].type;
      const defIds = new Set(this.deferred.flat().map(x => x.id));
      const pend = this.batch.filter(id => W[id] && lvl(id) < 5 && !defIds.has(id));
      if(!pend.length) return this.deferred.length ? this.deferred.flat()[0].type : 'end';
      const st = Math.min(...pend.map(id => lvl(id) === 0 && S.skipWarmup ? 1 : lvl(id)));
      if(st >= 3 && !this.matched && this.batch.filter(id => W[id]).length >= 3) return 'match';
      return TYPE_BY_LV[st];
    },
    next(){
      if(this.carry.length && this.carryAt.length && this.asked >= this.carryAt[0]){
        this.carryAt.shift(); const id = this.carry.shift();
        this.asked++; this.label = '前一組複習';
        const type = this.carryType || pick(['zh2en','spell']); this.carryType = null;
        return {type, id, carry:true, scope:this.scope};
      }
      while(!this.matchQ.length && !this.queue.length){ if(!this.startStage()) return null; }
      this.asked++;
      if(this.matchQ.length){ this.label = `第 ${this.group} 組・配對`; return {type:'match', ids:this.matchQ.shift(), scope:this.scope}; }
      const it = this.queue.shift(); this.last = it.id;
      this.label = `第 ${this.group} 組・${it.remedial ? '再看一次' : STAGE_NAME[TYPE_BY_LV.indexOf(it.type)]}`;
      return {type: it.type, id: it.id, scope: this.scope, remedial: !!it.remedial};
    },
    onResult(q, ok){
      const p = prog(q.id);
      if(q.type === 'card'){
        if(!p.learnedAt){ p.learnedAt = Date.now(); logDay().nw++; SES.newL++; }
        if(!q.remedial){ p.level = Math.max(p.level, 1); this.stageDone++; }
        p.lastSeen = Date.now(); return '';
      }
      if(q.carry) return ok ? '前一組的字，記得很牢' : '已加入錯字池';
      const cur = q.type === TYPE_BY_LV[this.stage] && this.stageTotal > 0;
      if(ok){
        if(cur) this.stageDone++;
        p.level = Math.min(5, Math.max(p.level, TYPE_BY_LV.indexOf(q.type) + 1));
        if(p.level === 5){ p.srs = {stage:0, due:addDays(today(), 1)}; p.confirmedAt = null; SES.five++; return '完成五關！明天第一次複習答對就算精通'; }
        return `升到 Lv ${p.level} ${LV_NAME[p.level]}`;
      }
      this.errs[q.id] = (this.errs[q.id] || 0) + 1;
      const ek = q.id + '|' + q.type, n = this.stageErr[ek] = (this.stageErr[ek] || 0) + 1;
      const Q = this.queue, item = {id:q.id, type:q.type};
      const group = n >= 2 ? [{id:q.id, type:'card', remedial:true}, item] : [item];
      if(Q.filter(x => x.id !== q.id).length >= 2){
        if(group.length === 2){ Q.splice(1, 0, group[0]); Q.splice(Math.min(4, Q.length), 0, item); }
        else Q.splice(2, 0, item);
      } else this.deferred.push(group);
      return n >= 2 ? '稍後重看單字卡再考一次' : '稍後再考一次，已加入錯字池';
    },
    onMatchWrong(id){ this.errs[id] = (this.errs[id] || 0) + 1; },
    carryOut(){ return Object.keys(this.errs).filter(id => W[id]).sort((a,b) => this.errs[b] - this.errs[a]).slice(0, 2); },
    progress(){
      const n = this.batch.length, sum = this.batch.reduce((a,id) => a + Math.min(5, lvl(id)), 0);
      const q = SES.q, plain = q && !q.carry && q.type === TYPE_BY_LV[this.stage] && this.stageTotal > 0;
      return {text: plain ? `${Math.min(this.stageDone + 1, this.stageTotal)} / ${this.stageTotal}` : '', ratio: n ? sum/(5*n) : 1};
    }
  };
}
/* 複習累計答錯 LEECH_AT 次時，自動收進「頑固字」單字簿（只在剛好達到時收一次） */
function addLeech(id){
  let b = bookByName(LEECH_BOOK); if(!b) b = newBook(LEECH_BOOK);
  if(b.wordIds.includes(id)) return '';
  b.wordIds.push(id); save('books');
  return `，已收進「${LEECH_BOOK}」`;
}
function ReviewPhase(ids){
  return {
    /* 待確認的字（第一次複習）維持混合題型；已精通的字只考英選中，節省複習時間（v1.4.0） */
    label:'遺忘曲線複習', ids, i:0, types: ids.map(id => isMastered(id) ? 'en2zh' : pick(['en2zh','zh2en','spell'])),
    next(){ while(this.i < this.ids.length){ const k = this.i++, id = this.ids[k]; if(W[id]) return {type: this.types[k], id}; } return null; },
    peek(){ for(let k = this.i; k < this.ids.length; k++) if(W[this.ids[k]]) return this.types[k]; return 'end'; },
    onResult(q, ok){
      const p = prog(q.id);
      if(ok){
        const st = p.srs ? Math.min(p.srs.stage + 1, INTERVALS.length-1) : 0;
        p.srs = {stage:st, due:addDays(today(), INTERVALS[st])};
        if(!p.confirmedAt){ p.confirmedAt = Date.now(); SES.confirmed++; return `確認精通！下次複習：${INTERVALS[st]} 天後`; }
        return `下次複習：${INTERVALS[st]} 天後`;
      }
      /* 答錯不歸零：間隔退回兩階，明天再複習（v1.3.0） */
      const st = p.srs ? Math.max(0, p.srs.stage - REVIEW_BACK) : 0;
      p.srs = {stage:st, due:addDays(today(), 1)};
      p.revWrong = (p.revWrong || 0) + 1;
      const leech = p.revWrong === LEECH_AT ? addLeech(q.id) : '';
      return `間隔退回，明天再複習${leech || '，已加入錯字池'}`;
    },
    progress(){ return {text:`${this.i} / ${this.ids.length}`, ratio: this.ids.length ? (this.i-1)/this.ids.length : 1}; }
  };
}
function PoolPhase(ids){
  return {
    label:'錯字池', queue: ids.slice(), seen:{}, done:0, pt:null,
    next(){ while(this.queue.length){ const id = this.queue.shift(); if(W[id] && POOL.some(x => x.wordId === id)){ this.seen[id] = (this.seen[id]||0) + 1; this.done++; const type = this.pt || pick(['en2zh','zh2en','spell']); this.pt = null; return {type, id}; } } return null; },
    peek(){ return this.queue.some(id => W[id] && POOL.some(x => x.wordId === id)) ? (this.pt || (this.pt = pick(['en2zh','zh2en','spell']))) : 'end'; },
    onResult(q, ok){
      const e = POOL.find(x => x.wordId === q.id);
      const again = () => { if(this.seen[q.id] < 3 && this.queue.length >= 2) this.queue.push(q.id); };
      if(ok && e){
        e.streak++;
        if(e.streak >= 3){ POOL = POOL.filter(x => x !== e); SES.poolOut++; return '連續答對 3 次，已移出錯字池'; }
        again(); return `連續答對 ${e.streak} / 3`;
      }
      again(); return '連續答對次數歸零';
    },
    progress(){ const left = this.queue.length; return {text:`剩 ${left} 題`, ratio: this.done/(this.done + left + 1)}; }
  };
}

/* ========== 例句克漏字（v1.3.0） ========== */
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
/* 常見不規則動詞（克漏字比對用，v1.3.0） */
const IRREG = {arise:'arose arisen', bear:'bore borne', break:'broke broken', bring:'brought', build:'built', burst:'burst', buy:'bought',
  catch:'caught', choose:'chose chosen', come:'came', cut:'cut', deal:'dealt', do:'did done does', draw:'drew drawn', drive:'drove driven',
  eat:'ate eaten', fall:'fell fallen', feel:'felt', fight:'fought', find:'found', forgo:'forwent forgone', get:'got gotten', give:'gave given',
  go:'went gone goes', grow:'grew grown', hang:'hung', have:'has had', hold:'held', keep:'kept', know:'knew known', lay:'laid', lead:'led',
  leave:'left', lend:'lent', let:'let', lose:'lost', make:'made', mean:'meant', meet:'met', overcome:'overcame', pay:'paid', put:'put',
  rise:'rose risen', run:'ran', say:'said', see:'saw seen', seek:'sought', sell:'sold', send:'sent', set:'set', shut:'shut', sit:'sat',
  speak:'spoke spoken', spend:'spent', spell:'spelt', stand:'stood', stick:'stuck', strike:'struck', sweep:'swept', take:'took taken',
  teach:'taught', tell:'told', think:'thought', throw:'threw thrown', undertake:'undertook undertaken', wear:'wore worn', wind:'wound',
  withdraw:'withdrew withdrawn', write:'wrote written'};
/* 一個英文字的常見變化（-s、-ed、-ing、去 e、y 改 i、重複字尾子音、-c 加 k、不規則動詞） */
function wordForms(base){
  const v = new Set([base]);
  if(!/^[a-z]+$/.test(base)) return v;
  const last = base.slice(-1), stem = base.slice(0, -1);
  ['s','es','d','ed','ing'].forEach(x => v.add(base + x));
  if(last === 'e') v.add(stem + 'ing');
  if(last === 'c'){ v.add(base + 'ked'); v.add(base + 'king'); v.add(base + 'ks'); }
  if(/[^aeiou]y$/.test(base)){ v.add(stem + 'ies'); v.add(stem + 'ied'); }
  if(/[^aeiou][aeiou][bdgklmnprt]$/.test(base)){ v.add(base + last + 'ed'); v.add(base + last + 'ing'); }
  if(IRREG[base]) IRREG[base].split(' ').forEach(x => v.add(x));
  return v;
}
/* 在例句中找出這個字；片語只讓第一個字變化（如 carried out、made a reservation），找不到就不出題 */
function clozeForm(w){
  if(!w || !w.example || !w.en) return null;
  const parts = w.en.toLowerCase().trim().split(/\s+/);
  const alts = [...wordForms(parts[0])].sort((a, b) => b.length - a.length).map(escRe).join('|');
  const tail = parts.slice(1).map(x => '\\s+' + escRe(x)).join('');
  const m = new RegExp(`(^|[^A-Za-z])((?:${alts})${tail})(?![A-Za-z])`, 'i').exec(w.example);
  if(!m) return null;
  const at = m.index + m[1].length;
  return {before: w.example.slice(0, at), form: m[2], after: w.example.slice(at + m[2].length)};
}
const clozeIds = () => Object.keys(W).filter(id => isMastered(id) && clozeForm(W[id]));
function ClozePhase(ids){
  /* 克漏字答錯較多、練得較少的字優先 */
  const score = id => { const t = (P[id] && P[id].typeStats.cloze) || {c:0, w:0}; return t.c - 2 * t.w; };
  const list = shuffle(ids.slice()).sort((a, b) => score(a) - score(b)).slice(0, CLOZE_COUNT);
  return {
    label:'例句克漏字', queue: list, total: list.length, seen:{}, done:0,
    next(){ while(this.queue.length){ const id = this.queue.shift(); if(W[id] && clozeForm(W[id])){ this.seen[id] = (this.seen[id] || 0) + 1; this.done++; return {type:'cloze', id}; } } return null; },
    peek(){ return this.queue.some(id => W[id]) ? 'cloze' : 'end'; },
    onResult(q, ok){
      if(ok) return '';
      if(this.seen[q.id] < 2 && this.queue.length >= 2){ this.queue.splice(Math.min(3, this.queue.length), 0, q.id); this.total++; return '稍後再考一次，已加入錯字池'; }
      return '已加入錯字池';
    },
    progress(){ return {text:`${this.done} / ${this.total}`, ratio: this.total ? (this.done - 1) / this.total : 1}; }
  };
}

function startSession(phases, opts = {}){
  phases = phases.filter(Boolean);
  SES = {phases, pi:0, q:null, ans:0, cor:0, newL:0, five:0, confirmed:0, poolOut:0, opts};
  $('#session').hidden = false; setLock('session', true);
  nextQ();
}
function nextQ(){
  clearTimeout(SES.timer);
  while(SES.pi < SES.phases.length){
    const ph = SES.phases[SES.pi], q = ph.next();
    if(q){ q.phase = ph; SES.q = q; renderQ(q); return; }
    SES.pi++;
  }
  endSession();
}
function closeSession(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  SES = null; $('#session').hidden = true; setLock('session', false); render();
}
function setHeader(){
  const ph = SES.q.phase, pr = ph.progress();
  $('#s-label').textContent = ph.label;
  $('#s-count').textContent = pr.text;
  $('#s-bar').style.width = Math.max(0, Math.min(1, pr.ratio)) * 100 + '%';
}
function stampsHTML(id){
  const l = lvl(id);
  return `<div class="stamps">${[0,1,2,3,4].map(i => `<i class="${i<l?'f':''}"></i>`).join('')}<span>${l === 0 && S.skipWarmup ? '新字' : `Lv ${l} ${LV_NAME[l]}`}</span></div>`;
}

function renderQ(q){
  setHeader();
  const body = $('#s-body'), foot = $('#s-foot');
  body.scrollTop = 0; foot.innerHTML = '';
  const isM = q.phase.kind === 'mastery' && !q.carry;
  if(q.type === 'match') return renderMatch(q);
  const w = W[q.id];
  const head = isM ? stampsHTML(q.id) : '';

  if(q.type === 'card'){
    body.innerHTML = head + `<div class="fb" style="margin-top:6px">${wordDetail(w)}</div>`;
    foot.innerHTML = `<button class="btn" data-act="card-next">${q.remedial ? '記住了，再試一次' : '記住了，下一個'}</button>`;
    autoSpeak(w.en); return;
  }
  if(q.type === 'cloze'){
    const f = clozeForm(w); q.form = f.form;
    const ids = shuffle([q.id].concat(distractors(q.id, 3, Object.keys(W), true)));
    body.innerHTML = `<div class="prompt" style="padding:8px 0 0"><div class="hint">選出最適合填入空格的字（選項為原形）</div></div>
      <div class="cloze">${esc(f.before)}<span class="blank" id="cz-blank">&nbsp;</span>${esc(f.after)}</div>
      <div class="cloze-zh" id="cz-zh"></div>
      <div class="opts">${ids.map(id => `<button class="opt en" data-act="opt" data-id="${id}">${esc(W[id].en)}</button>`).join('')}</div>`;
    return;
  }
  if(q.type === 'en2zh' || q.type === 'zh2en'){
    const scope = q.scope || scopeOfWord(q.id);
    const en2zh = q.type === 'en2zh';
    /* 中選英的選項是英文，加入形近字當干擾項（v1.3.0） */
    const ids = shuffle([q.id].concat(distractors(q.id, 3, scope, !en2zh)));
    body.innerHTML = head + `<div class="prompt">${en2zh
        ? `<div class="row" style="justify-content:center"><span class="en">${esc(w.en)}</span>${spkBtn(w.en)}</div><div class="pos">${esc(w.pos)}</div>`
        : `<div class="zh">${esc(w.zh)}</div><div class="pos">${esc(w.pos)}</div>`}</div>
      <div class="opts">${ids.map(id => `<button class="opt ${en2zh?'':'en'}" data-act="opt" data-id="${id}">${esc(en2zh ? W[id].zh : W[id].en)}</button>`).join('')}</div>`;
    if(en2zh) autoSpeak(w.en);
    return;
  }
  if(q.type === 'letters'){
    const chars = [...w.en];
    q.target = chars.filter(c => c !== ' ');
    let order = shuffle(q.target.map((c,i) => i));
    if(q.target.length > 1){ let tries = 0; while(order.every((v,i) => q.target[v] === q.target[i]) && tries++ < 10) order = shuffle(order); }
    q.order = order; q.typed = [];
    body.innerHTML = head + `<div class="prompt"><div class="zh">${esc(w.zh)}</div><div class="pos">${esc(w.pos)}</div><div class="hint">依序點字母拼出單字</div></div>
      <div class="slots" id="slots"></div><div class="tiles" id="tiles">${order.map((ti,k) => `<button class="tile" data-act="tile" data-k="${k}">${esc(q.target[ti])}</button>`).join('')}</div>`;
    foot.innerHTML = `<div class="row"><button class="btn ghost" data-act="tile-back">退一格</button><button class="btn ghost" data-act="tile-giveup">不會</button></div>`;
    drawSlots(q); return;
  }
  if(q.type === 'spell'){
    body.innerHTML = head + `<div class="prompt"><div class="zh">${esc(w.zh)}</div><div class="pos">${esc(w.pos)}</div><div class="hint">輸入英文拼字</div></div>
      <input class="spell" id="spell-in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="輸入英文">`;
    foot.innerHTML = `<div class="row"><button class="btn ghost" data-act="spell-giveup">不會</button><button class="btn" data-act="spell-check">確認</button></div>`;
    const inp = $('#spell-in');
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); checkSpell(); } });
    /* 打對時自動送出，不必按確認 */
    inp.addEventListener('input', () => { if(normAns(inp.value) === normAns(w.en)) checkSpell(); });
    /* 鍵盤已開著（上一題也是拼寫）時，先打的字接到這一題 */
    const kk = $('#kb-keep'); if(document.activeElement === kk && kk.value){ inp.value = kk.value.replace(/^\s+/, ''); }
    kk.value = '';
    inp.focus();
    if(inp.value && normAns(inp.value) === normAns(w.en)) checkSpell();

}
function drawSlots(q){
  const w = W[q.id]; let k = 0, html = '';
  for(const c of w.en){
    if(c === ' '){ html += '<span class="gap"></span>'; continue; }
    const t = q.typed[k]; html += `<span class="slot ${t != null ? 'f' : ''}">${t != null ? esc(q.target[q.order[t]]) : ''}</span>`; k++;
  }
  $('#slots').innerHTML = html;
}

function answer(ok, extra = {}){
  const q = SES.q; if(!q || q.done) return; q.done = true;
  SES.ans++; if(ok) SES.cor++;
  record(q.id, q.type, ok);
  if(q.type === 'spell' && !ok && extra.input) recordSpellPos(W[q.id].en, extra.input);
  const note = q.phase.onResult(q, ok) || '';
  updateFinished(); save('progress','pool','log','books');
  keyboardForNext();
  showFeedback(q, ok, note, extra);
}
function peekType(){
  for(let i = SES.pi; i < SES.phases.length; i++){ const ph = SES.phases[i], t = ph.peek ? ph.peek() : null; if(t !== 'end') return t; }
  return null;
}
/* 在使用者點擊的當下決定鍵盤：下一題是拼寫就把焦點移到隱藏欄位，讓鍵盤保持開啟（iPhone 只允許在點擊時開啟鍵盤） */
function keyboardForNext(){
  const kk = $('#kb-keep');
  if(peekType() === 'spell'){ kk.value = ''; kk.focus(); }
  else if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function showFeedback(q, ok, note){
  const w = W[q.id], cz = q.type === 'cloze';
  const ans = q.type === 'en2zh' ? w.zh : w.en;
  if(cz){
    const bl = $('#cz-blank'); if(bl){ bl.textContent = q.form; bl.classList.add(ok ? 'good' : 'bad'); }

  setHeader();
  if(!ok && q.type !== 'en2zh') autoSpeak(w.en);
  scheduleNext(cz ? (ok ? 1500 : 3000) : (ok ? 900 : 2200), ok ? speakCorrect(w.en) : null);
}
function showWhy(){
  const q = SES && SES.q; if(!q || !q.done || q.hold || SES.ended || !q.id) return;
  q.hold = true; clearTimeout(SES.timer);
  const body = $('#s-body'), d = document.createElement('div');
  d.className = 'fb'; d.innerHTML = wordDetail(W[q.id]);
  body.appendChild(d);
  const why = $('#s-foot .why'); if(why) why.remove();
